name: CI

# Trigger CI on push or pull request
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      
      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint and Format
        run: |
          uv run ruff check src/
          uv run ruff format --check src/
      
      - name: Security audit
        run: uv run pip-audit
      
      - name: Run tests
        run: uv run pytest tests/

  docker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build image (local test)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: python-sandbox:test
      
      - name: Test image - Python imports
        run: |
          docker run --rm python-sandbox:test python -c "
          import httpx
          import mcp
          import dotenv
          import pydantic
          import docker
          import bs4
          print('All imports OK!')
          "
      
      - name: Test image - Server startup
        run: |
          timeout 5 docker run --rm python-sandbox:test python -m python_code_sandbox_mcp.server 2>&1 || true
      
      - name: Build test (Multi-arch - no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
