[project]
name = "python-code-sandbox-mcp"
version = "0.2.0"
description = "A secure Python execution sandbox MCP server using Docker"
authors = [
    {name = "筱可", email = "xiaoke@example.com"}
]
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "mcp>=0.1.0",
    "docker>=7.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.20.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pip-audit",
    "pre-commit",
    "pytest",
    "pytest-asyncio"
]

[project.scripts]
python-code-sandbox = "python_code_sandbox_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/python_code_sandbox_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
